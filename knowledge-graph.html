<style>
  body { margin:0; background:#1a1a2e; font-family:'Segoe UI',sans-serif; overflow:hidden; }
  #title { position:absolute; top:16px; left:50%; transform:translateX(-50%); color:#e0e0ff; font-size:20px; font-weight:bold; text-align:center; z-index:10; }
  #subtitle { position:absolute; top:44px; left:50%; transform:translateX(-50%); color:#888; font-size:12px; z-index:10; }

  #tooltip { position:absolute; display:none; background:rgba(10,10,30,0.92); border:1px solid #444; border-radius:8px; padding:10px 14px; color:#eee; font-size:13px; pointer-events:none; max-width:220px; z-index:20; line-height:1.6; }
  .node circle { cursor:pointer; stroke:#fff; stroke-width:1.5px; }
  .node text { fill:#eee; font-size:11px; pointer-events:none; text-anchor:middle; dominant-baseline:middle; }
  .link { stroke:#555; stroke-opacity:0.5; }
  .link.highlighted { stroke:#ffdd57; stroke-opacity:0.9; stroke-width:2px; }
  .node.dimmed circle { opacity:0.2; }
  .node.dimmed text { opacity:0.2; }
  .fire-badge { font-size:10px; }
</style>

    {"source":"jennifer_english","target":"clair_obscur","relation":"主演获BAFTA表演奖","count":1},
    {"source":"capcom","target":"pragmata","relation":"开发并发行","count":1},
    {"source":"gunzilla_games","target":"game_informer","relation":"收购持有","count":1},
    {"source":"vlad_korolev","target":"gunzilla_games","relation":"CEO","count":1},
    {"source":"gunzilla_games","target":"layoffs_2026","relation":"拖欠员工薪资","count":1},
    {"source":"iron_galaxy","target":"layoffs_2026","relation":"宣布裁员","count":1},
    {"source":"ea","target":"sims4_marketplace","relation":"推出主机端功能","count":1},
    {"source":"sims4_marketplace","target":"creator_marketing","relation":"扩大UGC社区触达","count":1},
    {"source":"generative_ai","target":"layoffs_2026","relation":"加速岗位替代与结构调整","count":1}
  ]
};

<script>
const COLOR_MAP = { company:'steelblue', person:'orange', technology:'#4caf50', event:'crimson', trend:'#9c27b0' };
const data = GRAPH_DATA;
const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select('#graph').attr('width', width).attr('height', height);
const g = svg.append('g');

svg.call(d3.zoom().scaleExtent([0.2, 5]).on('zoom', e => g.attr('transform', e.transform)));

const nodes = data.nodes.map(n => ({...n}));
const links = data.edges.map(e => ({...e}));

const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(110))
  .force('charge', d3.forceManyBody().strength(-350))
  .force('center', d3.forceCenter(width/2, height/2))
  .force('collision', d3.forceCollide().radius(d => Math.sqrt(d.count) * 18 + 12));

const link = g.append('g').selectAll('line').data(links).join('line')
  .attr('class', 'link')
  .attr('stroke-width', d => Math.sqrt(d.count) * 1.2 + 1);

const node = g.append('g').selectAll('g').data(nodes).join('g')
  .attr('class', 'node')
  .call(
    d3.drag()
      .on('start', (e,d) => { if(\!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',  (e,d) => { d.fx=e.x; d.fy=e.y; })
      .on('end',   (e,d) => { if(\!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; })
  );

node.append('circle')
  .attr('r', d => Math.sqrt(d.count) * 10 + 12)
  .attr('fill', d => COLOR_MAP[d.type] || '#aaa')
  .attr('stroke-width', 1.5);

node.filter(d => d.viral).append('text')
  .attr('class','fire-badge')
  .attr('y', d => -(Math.sqrt(d.count)*10+16))
  .attr('text-anchor','middle')
  .attr('font-size','14px')
  .text('\uD83D\uDD25');

node.append('text')
  .attr('y', 1)
  .attr('font-size', d => Math.min(Math.sqrt(d.count)*4+9, 12))
  .text(d => d.label);

const tooltip = d3.select('#tooltip');

node.on('mouseover', (e, d) => {
  tooltip.style('display','block').html(
    `<b>${d.label}</b><br>类型：${d.type}<br>板块：${d.section}<br>出现周数：${d.count}${d.viral ? '<br>🔥 曾引爆' : ''}`
  );
}).on('mousemove', e => {
  tooltip.style('left', (e.pageX+14)+'px').style('top', (e.pageY-30)+'px');
}).on('mouseout', () => tooltip.style('display','none'));

node.on('click', (e, d) => {
  e.stopPropagation();
  const connected = new Set([d.id]);
  links.forEach(l => {
    if(l.source.id===d.id) connected.add(l.target.id);
    if(l.target.id===d.id) connected.add(l.source.id);
  });
  node.classed('dimmed', n => \!connected.has(n.id));
  link.classed('highlighted', l => l.source.id===d.id || l.target.id===d.id);
});

svg.on('click', () => {
  node.classed('dimmed', false);
  link.classed('highlighted', false);
});

link.on('mouseover', (e, d) => {
  tooltip.style('display','block').html(`关系：<b>${d.relation}</b><br>出现次数：${d.count}`);
}).on('mousemove', e => {
  tooltip.style('left', (e.pageX+14)+'px').style('top', (e.pageY-30)+'px');
}).on('mouseout', () => tooltip.style('display','none'));

sim.on('tick', () => {
  link.attr('x1', d=>d.source.x).attr('y1', d=>d.source.y)
      .attr('x2', d=>d.target.x).attr('y2', d=>d.target.y);
  node.attr('transform', d => `translate(${d.x},${d.y})`);
});
</script>
</body>
</html>

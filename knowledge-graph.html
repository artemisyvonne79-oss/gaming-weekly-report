<script>
const COLOR_MAP = { company:'steelblue', person:'orange', technology:'#4caf50', event:'crimson', trend:'#9c27b0' };
const data = GRAPH_DATA;
const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select('#graph').attr('width', width).attr('height', height);
const g = svg.append('g');
svg.call(d3.zoom().scaleExtent([0.1, 6]).on('zoom', e => g.attr('transform', e.transform)));
const nodes = data.nodes.map(n => ({...n}));
const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);
const links = data.edges.map(e => ({...e}));
const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(d => 90 + Math.sqrt(((d.source.count||1)+(d.target.count||1))*10)))
  .force('charge', d3.forceManyBody().strength(-300))
  .force('center', d3.forceCenter(width/2, height/2))
  .force('collision', d3.forceCollide().radius(d => Math.sqrt(d.count)*14+14));
const link = g.append('g').selectAll('line').data(links).join('line')
  .attr('class','link').attr('stroke-width', d => Math.sqrt(d.count||1)*1.2+0.8);
const node = g.append('g').selectAll('g').data(nodes).join('g').attr('class','node')
  .call(d3.drag()
    .on('start',(e,d)=>{ if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag', (e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on('end',  (e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));
node.append('circle')
  .attr('r', d => Math.sqrt(d.count)*10+12)
  .attr('fill', d => COLOR_MAP[d.type]||'#aaa')
  .attr('stroke-width',1.5);
node.filter(d => d.viral).append('text')
  .attr('class','fire-badge')
  .attr('y', d => -(Math.sqrt(d.count)*10+16))
  .attr('text-anchor','middle').attr('font-size','14px').text('🔥');
node.append('text')
  .attr('y',1)
  .attr('font-size', d => Math.min(Math.sqrt(d.count)*4+9,13))
  .text(d => d.label);
const tooltip = d3.select('#tooltip');
node.on('mouseover',(e,d) => {
  tooltip.style('display','block').html(
    '<b>'+d.label+'</b><br>类型：'+d.type+'<br>板块：'+d.section+'<br>出现周数：'+d.count+(d.viral?'<br>🔥 曾引爆':'')
  );
}).on('mousemove',e => {
  tooltip.style('left',(e.pageX+14)+'px').style('top',(e.pageY-30)+'px');
}).on('mouseout',()=>tooltip.style('display','none'));
node.on('click',(e,d)=>{
  e.stopPropagation();
  const connected = new Set([d.id]);
  links.forEach(l => {
    if(l.source.id===d.id) connected.add(l.target.id);
    if(l.target.id===d.id) connected.add(l.source.id);
  });
  node.classed('dimmed', n => !connected.has(n.id));
  link.classed('highlighted', l => l.source.id===d.id||l.target.id===d.id);
});
svg.on('click',()=>{ node.classed('dimmed',false); link.classed('highlighted',false); });
link.on('mouseover',(e,d)=>{
  tooltip.style('display','block').html('关系：<b>'+d.relation+'</b><br>出现次数：'+(d.count||1));
}).on('mousemove',e=>{
  tooltip.style('left',(e.pageX+14)+'px').style('top',(e.pageY-30)+'px');
}).on('mouseout',()=>tooltip.style('display','none'));
sim.on('tick',()=>{
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform',d=>'translate('+d.x+','+d.y+')');
});
</script>
